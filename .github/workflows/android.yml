name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build all variants
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease assembleNightly

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeStudio-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeStudio-release.apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v3
        with:
          name: CodeStudio-nightly.apk
          path: app/build/outputs/apk/nightly/app-nightly.apk
